<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <div class="row pl-lg-5 pr-lg-5 header-row">
          <h4 class="card-title">
            Feuille de présence pour la date {{ date | date : "dd-MM-yyyy" }}
          </h4>
        </div>
      </div>
      <div class="card-body">
        <div>
          <table class="table">
            <thead class="text-primary">
              <th class="label" style="width: 27%">Opérateur</th>
              <th style="width: 6%">Présence</th>
            </thead>
            <tbody>
              <tr *ngFor="let presence of presences">
                <td>
                  {{ presence.operator?.userFirstName }}
                  {{ presence.operator?.userLastName }}
                </td>
                <td>
                  <input type="checkbox" [(ngModel)]="presence.present" />
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="row">
  <div class="update ml-auto mr-2">
    <button type="submit" class="btn cancel btn-round" (click)="cancel()">
      Retour
    </button>
  </div>
  <div class="update mr-auto">
    <button type="submit" class="btn btn-primary btn-round" (click)="onSave()">
      Enregistrer
    </button>
  </div>
</div>
