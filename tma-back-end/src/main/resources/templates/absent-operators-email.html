<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            border: 1px solid #dcdcdc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #FFFF00;
            padding: 10px;
            text-align: center;
        }
        .header img {
            width: 150px;
        }
        .content {
            padding: 20px;
            color: #333;
        }
        .content h1 {
            color: #000;
            font-size: 24px;
        }
        .content p {
            font-size: 16px;
            line-height: 1.5;
        }
        .content .highlight {
            background-color: #ffcc00;
            padding: 5px;
            font-weight: bold;
        }
        .footer {
            background-color: #000;
            color: #ffcc00;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="cid:logo" alt="Sartorius Logo">
    </div>
    <div class="content">
        <h1>Absent Operators Notification</h1>
        <p>Dear <span class="highlight">${teamLeader}</span>,</p>
        <p>The following operators were absent from the training session on <span class="highlight">${date}</span>:</p>
        <ul>
            <!-- Absent operators will be listed here -->
            ${operators}
        </ul>
        <p>Please take the necessary actions.</p>
        <p>Best regards,<br/>Training Management System</p>
    </div>
    <div class="footer">
        &copy; ${year} Sartorius. All rights reserved.
    </div>
</div>
</body>
</html>
